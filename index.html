.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(34,211,238,0.12);color:#22d3ee\">Hoy<\/span>\n                  <\/sc-if>\n                <\/div>\n                <sc-if value=\"{{ cl.hasStudents }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:14px\">\n                    <sc-for list=\"{{ cl.studentChips }}\" as=\"sc\" hint-placeholder-count=\"4\">\n                      <div style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:#1a1a1e;border:1px solid rgba(255,255,255,0.07)\">\n                        <sc-if value=\"{{ sc.hasAttendance }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div title=\"{{ sc.attendanceTitle }}\" style=\"width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid {{ sc.attendanceColor }};flex-shrink:0\"><\/div>\n                        <\/sc-if>\n                        <div style=\"flex:1;font-size:13px;font-weight:600;color:#d5d6da\">{{ sc.name }}<\/div>\n                        <div onclick=\"{{ sc.move }}\" style=\"font-size:12px;font-weight:700;color:#22d3ee;cursor:pointer\">Mover<\/div>\n                      <\/div>\n                    <\/sc-for>\n                  <\/div>\n                  <button onclick=\"{{ cl.takeAttendance }}\" style=\"padding:9px 16px;border-radius:10px;border:1px solid rgba(34,211,238,0.4);background:rgba(34,211,238,0.08);color:#22d3ee;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer\">Registrar asistencia<\/button>\n                <\/sc-if>\n                <sc-if value=\"{{ cl.noStudents }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:14px;text-align:center;color:#6b6d74;font-size:13px;background:#1a1a1e;border-radius:10px\">Sin estudiantes asignados a esta clase.<\/div>\n                <\/sc-if>\n              <\/div>\n            <\/sc-for>\n            <sc-if value=\"{{ noDaySessions }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#131316;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:40px;text-align:center;color:#6b6d74;font-size:13.5px\">Sin clases este d\u00eda.<\/div>\n            <\/sc-if>\n          <\/sc-if>\n\n          <!-- WEEK VIEW -->\n          <sc-if value=\"{{ agendaViewIsWeek }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"cp-agenda-scroll\">\n            <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:10px\">\n              <sc-for list=\"{{ weekDays }}\" as=\"wd\" hint-placeholder-count=\"7\">\n                <div onclick=\"{{ wd.selectDay }}\" style=\"background:#131316;border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:12px;min-height:140px;cursor:pointer\">\n                  <div style=\"text-align:center;margin-bottom:10px\">\n                    <div style=\"font-size:11px;color:#6b6d74;font-weight:700;text-transform:uppercase\">{{ wd.dayName }}<\/div>\n                    <div style=\"font-family:'Sora',sans-serif;font-size:16px;font-weight:700;margin-top:2px\">{{ wd.dayNum }}<\/div>\n                  <\/div>\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <sc-for list=\"{{ wd.sessions }}\" as=\"ss\" hint-placeholder-count=\"1\">\n                      <div style=\"font-size:11px;font-weight:700;padding:5px 8px;border-radius:8px;background:rgba(34,211,238,0.1);color:#22d3ee;text-align:center\">{{ ss.hora }} \u00b7 {{ ss.count }}<\/div>\n                    <\/sc-for>\n                  <\/div>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n            <\/div>\n          <\/sc-if>\n\n          <!-- MONTH VIEW -->\n          <sc-if value=\"{{ agendaViewIsMonth }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"cp-agenda-scroll\">\n            <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:8px\">\n              <sc-for list=\"{{ monthCells }}\" as=\"mc\" hint-placeholder-count=\"42\">\n                <div onclick=\"{{ mc.go }}\" style=\"background:#131316;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:10px;min-height:76px;cursor:pointer;opacity:{{ mc.opacity }}\">\n                  <div style=\"font-size:13px;font-weight:700\">{{ mc.dayNum }}<\/div>\n                  <sc-if value=\"{{ mc.hasSessions }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:10.5px;font-weight:700;color:#22d3ee;margin-top:6px\">{{ mc.countLabel }}<\/div>\n                    <div style=\"font-size:10px;color:#6b6d74;margin-top:2px;text-transform:uppercase\">{{ mc.dayName }}<\/div>\n                  <\/sc-if>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n            <\/div>\n          <\/sc-if>\n        <\/div>\n      <\/sc-if>\n\n      <!-- PAGOS -->\n      <sc-if value=\"{{ isPayments }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-family:'Sora',sans-serif;font-size:22px;font-weight:700;margin-bottom:22px\">Pagos<\/div>\n          <div class=\"cp-desktop-table\" style=\"background:#131316;border:1px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden\">\n            <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1.2fr 1fr 2.2fr;gap:14px;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,0.06);color:#6b6d74;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase\">\n              <div>Estudiante<\/div><div>Valor mensual<\/div><div>Vencimiento<\/div><div>Estado<\/div><div><\/div>\n            <\/div>\n            <sc-for list=\"{{ paymentRows }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1.2fr 1fr 2.2fr;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.05)\">\n                <div style=\"font-size:14px;font-weight:700\">{{ p.name }}<\/div>\n                <div style=\"font-size:13.5px;color:#9a9ca3;white-space:nowrap\">{{ p.amountLabel }}<\/div>\n                <div style=\"font-size:13.5px;color:#9a9ca3;white-space:nowrap\">{{ p.dueDateLabel }}<\/div>\n                <div><span style=\"font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:{{ p.statusBg }};color:{{ p.statusColor }}\">{{ p.status }}<\/span><\/div>\n                <div>\n                  <sc-if value=\"{{ p.needsReminder }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;justify-content:flex-end;margin-bottom:8px\">\n                      <button onclick=\"{{ p.sendReminder }}\" style=\"padding:7px 12px;border-radius:9px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.08);color:#22d3ee;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap\">{{ p.reminderLabel }}<\/button>\n                    <\/div>\n                  <\/sc-if>\n                  <div style=\"display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap\">\n                    <button onclick=\"{{ p.editPayment }}\" style=\"padding:8px 12px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#9a9ca3;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap\">Editar<\/button>\n                    <button onclick=\"{{ p.registerPayment }}\" style=\"padding:8px 14px;border-radius:9px;border:none;background:#22d3ee;color:#06232b;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap\">Registrar pago<\/button>\n                  <\/div>\n                  <div style=\"text-align:right;font-size:11px;color:#6b6d74;margin-top:6px\">{{ p.reminderSentLabel }}<\/div>\n                <\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n\n          <div class=\"cp-mobile-card-list\">\n            <sc-for list=\"{{ paymentRows }}\" as=\"p\" hint-placeholder-count=\"7\">\n              <div style=\"background:#131316;border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:14px 16px\">\n                <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\">\n                  <div style=\"flex:1;font-size:14.5px;font-weight:700\">{{ p.name }}<\/div>\n                  <span style=\"font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:{{ p.statusBg }};color:{{ p.statusColor }}\">{{ p.status }}<\/span>\n                <\/div>\n                <div style=\"font-size:12.5px;color:#9a9ca3;margin-bottom:12px\">{{ p.amountLabel }} \u00b7 vence {{ p.dueDateLabel }}<\/div>\n                <sc-if value=\"{{ p.needsReminder }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button onclick=\"{{ p.sendReminder }}\" style=\"width:100%;padding:9px;border-radius:9px;border:1px solid rgba(34,211,238,0.3);background:rgba(34,211,238,0.08);color:#22d3ee;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;margin-bottom:8px\">{{ p.reminderLabel }}<\/button>\n                <\/sc-if>\n                <div style=\"display:flex;gap:8px\">\n                  <button onclick=\"{{ p.editPayment }}\" style=\"flex:1;padding:9px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#9a9ca3;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer\">Editar<\/button>\n                  <button onclick=\"{{ p.registerPayment }}\" style=\"flex:1;padding:9px;border-radius:9px;border:none;background:#22d3ee;color:#06232b;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer\">Registrar pago<\/button>\n                <\/div>\n                <div style=\"text-align:center;font-size:11px;color:#6b6d74;margin-top:8px\">{{ p.reminderSentLabel }}<\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n\n      <!-- PROFESORES -->\n      <sc-if value=\"{{ isTeachers }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"display:flex;align-items:center;margin-bottom:22px\">\n            <div style=\"font-family:'Sora',sans-serif;font-size:22px;font-weight:700\">Profesores<\/div>\n            <div style=\"flex:1\"><\/div>\n            <button onclick=\"{{ openNewTeacherModal }}\" style=\"padding:11px 18px;border-radius:10px;border:none;background:#22d3ee;color:#06232b;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer\">+ Nuevo profesor<\/button>\n          <\/div>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px\">\n            <sc-for list=\"{{ teacherCards }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div onclick=\"{{ t.openEdit }}\" style=\"background:#131316;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:20px;cursor:pointer\">\n                <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\">\n                  <div style=\"width:42px;height:42px;border-radius:12px;background:#1a1a1e;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#22d3ee\">{{ t.initial }}<\/div>\n                  <div style=\"flex:1\">\n                    <div style=\"font-size:14.5px;font-weight:700\">{{ t.name }}<\/div>\n                    <div style=\"font-size:12.5px;color:#9a9ca3\">{{ t.instagram }}<\/div>\n                  <\/div>\n                  <span style=\"font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:{{ t.statusBg }};color:{{ t.statusColor }}\">{{ t.status }}<\/span>\n                <\/div>\n                <div style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;color:#9a9ca3;margin-bottom:14px\">\n                  <div>{{ t.email }}<\/div>\n                  <div>{{ t.phone }}<\/div>\n                <\/div>\n                <div style=\"border-top:1px solid rgba(255,255,255,0.06);padding-top:12px;font-size:13px\">\n                  <span style=\"font-family:'Sora',sans-serif;font-weight:700;color:#f2f3f5\">{{ t.studentCount }}<\/span> <span style=\"color:#9a9ca3\">estudiantes asignados<\/span>\n                <\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n      <\/sc-if>\n\n      <!-- CONFIGURACION -->\n      <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:560px\">\n          <div style=\"font-family:'Sora',sans-serif;font-size:22px;font-weight:700;margin-bottom:22px\">Configuraci\u00f3n<\/div>\n          <div style=\"background:#131316;border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:6px;margin-bottom:16px\">\n            <div onclick=\"{{ goTeachers }}\" style=\"padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;display:flex;align-items:center\">\n              <div>\n                <div style=\"font-size:14px;font-weight:700\">Administrar profesores<\/div>\n                <div style=\"font-size:12.5px;color:#9a9ca3;margin-top:2px\">Crear, editar y desactivar profesores<\/div>\n              <\/div>\n              <div style=\"flex:1\"><\/div><div style=\"color:#6b6d74\">\u2192<\/div>\n            <\/div>\n          <\/div>\n          <div style=\"background:#131316;border:1px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden;margin-bottom:16px\">\n            <div style=\"padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px;font-weight:700;color:#6b6d74;text-transform:uppercase;letter-spacing:.04em\">Usuarios del sistema<\/div>\n            <sc-for list=\"{{ usersList }}\" as=\"u\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.05)\">\n                <div style=\"flex:1\">\n                  <div style=\"font-size:14px;font-weight:700\">{{ u.name }}<\/div>\n                  <div style=\"font-size:12.5px;color:#9a9ca3;margin-top:2px\">{{ u.email }}<\/div>\n                <\/div>\n                <span style=\"font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(34,211,238,0.12);color:#22d3ee\">{{ u.roleLabel }}<\/span>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"background:#131316;border:1px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden;margin-bottom:16px\">\n            <div style=\"padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px;font-weight:700;color:#6b6d74;text-transform:uppercase;letter-spacing:.04em\">Recordatorios de pago<\/div>\n            <div style=\"display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.05)\">\n              <div style=\"flex:1\">\n                <div style=\"font-size:14px;font-weight:700\">Recordatorios autom\u00e1ticos<\/div>\n                <div style=\"font-size:12.5px;color:#9a9ca3;margin-top:2px\">Avisar a estudiantes con pagos pr\u00f3ximos a vencer<\/div>\n              <\/div>\n              <div onclick=\"{{ toggleAutoReminders }}\" style=\"width:44px;height:26px;border-radius:20px;background:{{ autoToggleBg }};cursor:pointer;position:relative;flex-shrink:0;transition:background .15s ease\">\n                <div style=\"width:22px;height:22px;border-radius:50%;background:#f2f3f5;position:absolute;top:2px;left:{{ autoToggleKnobPos }};transition:left .15s ease\"><\/div>\n              <\/div>\n            <\/div>\n            <div style=\"display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.05)\">\n              <div style=\"flex:1\">\n                <div style=\"font-size:14px;font-weight:700\">D\u00edas de anticipaci\u00f3n<\/div>\n                <div style=\"font-size:12.5px;color:#9a9ca3;margin-top:2px\">Antes de la fecha de vencimiento<\/div>\n              <\/div>\n              <input type=\"number\" min=\"1\" max=\"14\" value=\"{{ reminderDaysBefore }}\" onchange=\"{{ setReminderDaysBefore }}\" style=\"width:70px;padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:#0d0d10;color:#f2f3f5;font-family:inherit;font-size:14px;outline:none;text-align:center\">\n            <\/div>\n            <div style=\"display:flex;align-items:center;gap:12px;padding:16px 18px\">\n              <div style=\"flex:1\">\n                <div style=\"font-size:14px;font-weight:700\">Canal de env\u00edo<\/div>\n                <div style=\"font-size:12.5px;color:#9a9ca3;margin-top:2px\">Email, push o ambos<\/div>\n              <\/div>\n              <div style=\"position:relative\">\n                <div onclick=\"{{ toggleReminderChannelDropdown }}\" style=\"padding:8px 12px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:#0d0d10;color:#f2f3f5;font-family:inherit;font-size:13.5px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;white-space:nowrap\">\n                  <span>{{ reminderChannel }}<\/span>\n                  <span style=\"color:#6b6d74;font-size:10px\">\u25be<\/span>\n                <\/div>\n                <sc-if value=\"{{ reminderChannelOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div onclick=\"{{ closeDropdown }}\" style=\"position:fixed;inset:0;z-index:200\"><\/div>\n                  <div style=\"position:absolute;top:calc(100% + 6px);right:0;min-width:130px;background:#1c1c21;border:1px solid rgba(255,255,255,0.12);border-radius:9px;z-index:201;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,0.5)\">\n                    <sc-for list=\"{{ reminderChannelOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                      <div onclick=\"{{ opt.select }}\" style=\"padding:10px 14px;font-size:13.5px;cursor:pointer;color:{{ opt.color }};background:{{ opt.bg }};white-space:nowrap\">{{ opt.label }}<\/div>\n                    <\/sc-for>\n                  <\/div>\n                <\/sc-if>\n              <\/div>\n            <\/div>\n          <\/div>\n          <button onclick=\"{{ logout }}\" style=\"padding:11px 18px;border-radius:10px;border:1px solid rgba(248,113,113,0.3);background:rgba(248,113,113,0.08);color:#f87171;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer\">Cerrar sesi\u00f3n<\/button>\n        <\/div>\n      <\/sc-if>\n\n    <\/div>\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<!-- PORTAL DE ESTUDIANTE -->\n<sc-if value=\"{{ isStudentPortal }}\" hint-placeholder-val=\"{{ false }}\">\n\n  <!-- Ya firm\u00f3 el consentimiento: dashboard -->\n  <sc-if value=\"{{ studentConsentSigned }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"min-height:100vh;width:100%;background:#0a0a0c;font-family:'Manrope',sans-serif;color:#f2f3f5;padding:24px\">\n      <div style=\"max-width:520px;margin:0 auto\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:22px\">\n          <img src=\"5b401033-86cf-4097-805f-e0f614385595\" alt=\"CP\" style=\"height:34px\">\n          <div style=\"flex:1\">\n            <div style=\"font-family:'Sora',sans-serif;font-size:18px;font-weight:700\">Hola, {{ myStudentName }}<\/div>\n            <div style=\"font-size:12.5px;color:#9a9ca3\">Calistenia Progresiva<\/div>\n          <\/div>\n          <button onclick=\"{{ logout }}\" style=\"padding:8px 14px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#9a9ca3;font-family:inherit;font-size:12.5px;cursor:pointer\">Salir<\/button>\n        <\/div>\n\n        <sc-if value=\"{{ paymentBannerShow }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px 16px;border-radius:12px;margin-bottom:18px;background:{{ paymentBann ">\n        <input value=\"{{ etInstagram }}\" onchange=\"{{ etInstagramChange }}\" placeholder=\"Instagram\" style=\"width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:#0d0d10;color:#f2f3f5;font-family:inherit;font-size:14px;outline:none\">\n        <div style=\"position:relative\">\n          <div onclick=\"{{ toggleEtStatusDropdown }}\" style=\"width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:#0d0d10;color:#f2f3f5;font-family:inherit;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none\">\n            <span>{{ etStatusLabel }}<\/span>\n            <span style=\"color:#6b6d74;font-size:11px\">\u25be<\/span>\n          <\/div>\n          <sc-if value=\"{{ etStatusOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div onclick=\"{{ closeDropdown }}\" style=\"position:fixed;inset:0;z-index:200\"><\/div>\n            <div style=\"position:absolute;top:calc(100% + 6px);left:0;right:0;background:#1c1c21;border:1px solid rgba(255,255,255,0.12);border-radius:10px;z-index:201;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,0.5)\">\n              <sc-for list=\"{{ etStatusOptions }}\" as=\"opt\" hint-placeholder-count=\"2\">\n                <div onclick=\"{{ opt.select }}\" style=\"padding:11px 14px;font-size:14px;cursor:pointer;color:{{ opt.color }};background:{{ opt.bg }}\">{{ opt.label }}<\/div>\n              <\/sc-for>\n            <\/div>\n          <\/sc-if>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex;gap:10px\">\n        <button onclick=\"{{ closeModal }}\" style=\"flex:1;padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#9a9ca3;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer\">Cancelar<\/button>\n        <button onclick=\"{{ saveEditTeacher }}\" style=\"flex:1;padding:11px;border-radius:10px;border:none;background:#22d3ee;color:#06232b;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer\">Guardar cambios<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/sc-if>\n\n<\/x-dc>\n<script type=\"text\/x-dc\" data-dc-script=\"\">\n\n\/\/ ============ Firebase ============\n\/\/ Reemplaza estos valores por los de tu propio proyecto (Firebase Console >\n\/\/ Configuraci\u00f3n del proyecto > tus apps > SDK setup and configuration).\nconst FIREBASE_CONFIG = {\n  apiKey: \"REEMPLAZA_CON_TU_API_KEY\",\n  authDomain: \"REEMPLAZA.firebaseapp.com\",\n  projectId: \"REEMPLAZA\",\n  storageBucket: \"REEMPLAZA.appspot.com\",\n  messagingSenderId: \"REEMPLAZA\",\n  appId: \"REEMPLAZA\",\n};\n\/\/ Sube esta versi\u00f3n cada vez que cambie el texto legal del consentimiento \u2014\n\/\/ a los estudiantes que ya firmaron una versi\u00f3n anterior se les pedir\u00e1\n\/\/ firmar de nuevo.\nconst CONSENT_VERSION = 1;\nconst IS_LOCAL_DEV = \/^(localhost|127\\.0\\.0\\.1)$\/.test(window.location.hostname);\n\nconst fbSdk = window.FB;\nconst fbApp = fbSdk.initializeApp(FIREBASE_CONFIG);\nconst fbAuth = fbSdk.getAuth(fbApp);\nconst fbDb = fbSdk.getFirestore(fbApp);\nconst fbStorage = fbSdk.getStorage(fbApp);\nif (IS_LOCAL_DEV) {\n  fbSdk.connectAuthEmulator(fbAuth, 'http:\/\/127.0.0.1:9099', { disableWarnings: true });\n  fbSdk.connectFirestoreEmulator(fbDb, '127.0.0.1', 8080);\n  fbSdk.connectStorageEmulator(fbStorage, '127.0.0.1', 9199);\n}\n\nfunction relativeTime(date) {\n  if (!date) return '';\n  const diffMs = Date.now() - date.getTime();\n  const mins = Math.floor(diffMs \/ 60000);\n  if (mins < 1) return 'Ahora';\n  if (mins < 60) return 'Hace ' + mins + (mins === 1 ? ' minuto' : ' minutos');\n  const hours = Math.floor(mins \/ 60);\n  if (hours < 24) return 'Hace ' + hours + (hours === 1 ? ' hora' : ' horas');\n  const days = Math.floor(hours \/ 24);\n  return 'Hace ' + days + (days === 1 ? ' d\u00eda' : ' d\u00edas');\n}\nfunction tsToDate(ts) {\n  return ts && typeof ts.toDate === 'function' ? ts.toDate() : null;\n}\n\nconst GENDER_OPTIONS = ['Masculino', 'Femenino', 'Otro'];\nconst LEVEL_OPTIONS = ['Principiante', 'Intermedio', 'Avanzado'];\nconst MODALITY_OPTIONS = ['Presencial', 'Online'];\nconst REMINDER_CHANNEL_OPTIONS = ['Email', 'WhatsApp', 'Ambos'];\nconst STATUS_OPTIONS = ['Activo', 'Pausado', 'Retirado'];\nconst TEACHER_STATUS_OPTIONS = ['Activo', 'Inactivo'];\n\nfunction computeAge(birthdate) {\n  if (!birthdate) return '';\n  const b = new Date(birthdate + 'T00:00:00');\n  const now = new Date();\n  let age = now.getFullYear() - b.getFullYear();\n  const m = now.getMonth() - b.getMonth();\n  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;\n  return age;\n}\n\nconst CP_LUGAR = 'Parque Juan Moya Morales, \u00d1u\u00f1oa';\nconst SESSION_TEMPLATES = [\n  { id: 'tpl1', teacherId: 't1', days: [1, 2, 3, 4, 5, 6], hora: '09:00 \u2013 10:00', lugar: CP_LUGAR, studentIds: [] },\n  { id: 'tpl2', teacherId: 't1', days: [1, 2, 3, 4, 5, 6], hora: '10:00 \u2013 11:00', lugar: CP_LUGAR, studentIds: [] },\n  { id: 'tpl3', teacherId: 't2', days: [1, 2, 3, 4, 5], hora: '18:00 \u2013 19:00', lugar: CP_LUGAR, studentIds: ['s1', 's3', 's4', 's7'] },\n  { id: 'tpl4', teacherId: 't2', days: [1, 2, 3, 4, 5], hora: '19:00 \u2013 20:00', lugar: CP_LUGAR, studentIds: ['s2', 's5', 's6'] },\n];\nconst DOW_NAMES = ['Domingo', 'Lunes', 'Martes', 'Mi\u00e9rcoles', 'Jueves', 'Viernes', 'S\u00e1bado'];\nconst MONTH_NAMES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];\n\nfunction pad2(n) { return String(n).padStart(2, '0'); }\nfunction toISODate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }\nfunction parseISO(iso) { return new Date(iso + 'T00:00:00'); }\nfunction addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISODate(d); }\nfunction startOfWeekISO(iso) { const d = parseISO(iso); const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day; d.setDate(d.getDate() + diff); return toISODate(d); }\nfunction startOfMonthISO(iso) { const d = parseISO(iso); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-01'; }\n\nfunction generateSessions() {\n  const sessions = [];\n  const now = new Date();\n  for (let offset = -21; offset <= 42; offset++) {\n    const d = new Date(now);\n    d.setDate(now.getDate() + offset);\n    const dow = d.getDay();\n    const iso = toISODate(d);\n    SESSION_TEMPLATES.forEach(tpl => {\n      if (tpl.days.includes(dow)) {\n        sessions.push({ id: tpl.id + '-' + iso, date: iso, hora: tpl.hora, lugar: tpl.lugar, teacherId: tpl.teacherId, studentIds: [...tpl.studentIds] });\n      }\n    });\n  }\n  return sessions;\n}\nfunction fmtDateLong(iso) {\n  const d = parseISO(iso);\n  return DOW_NAMES[d.getDay()] + ' ' + d.getDate() + ' de ' + MONTH_NAMES[d.getMonth()];\n}\nfunction capitalizeFirst(str) {\n  return str.charAt(0).toUpperCase() + str.slice(1);\n}\n\nconst STATUS_COLORS = {\n  'Activo': { bg: 'rgba(52,211,153,0.12)', color: '#34d399' },\n  'Pausado': { bg: 'rgba(251,191,36,0.12)', color: '#fbbf24' },\n  'Retirado': { bg: 'rgba(248,113,113,0.12)', color: '#f87171' },\n  'Inactivo': { bg: 'rgba(248,113,113,0.12)', color: '#f87171' },\n};\nconst PAY_COLORS = {\n  'Al d\u00eda': { bg: 'rgba(52,211,153,0.12)', color: '#34d399' },\n  'Pendiente': { bg: 'rgba(251,191,36,0.12)', color: '#fbbf24' },\n  'Atrasado': { bg: 'rgba(248,113,113,0.12)', color: '#f87171' },\n};\n\nfunction fmtDate(iso) {\n  const d = new Date(iso + 'T00:00:00');\n  return d.toLocaleDateString('es-CL', { day: '2-digit', month: 'short', year: 'numeric' });\n}\nfunction fmtCLP(n) {\n  return '$' + n.toLocaleString('es-CL');\n}\nfunction initials(name) {\n  return name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();\n}\n\nclass Component extends DCLogic {\n  sigCanvasRef = React.createRef();\n  sigPreviewRef = React.createRef();\n  _drawing = false;\n  _lastPoint = null;\n\n  componentDidMount() {\n    this.syncSignaturePreview();\n    this._unsub = [];\n    this._detailUnsub = null;\n    this.initAuth();\n  }\n  componentDidUpdate() {\n    this.syncSignaturePreview();\n  }\n  componentWillUnmount() {\n    this.stopDataSubscriptions();\n    if (this._detailUnsub) this._detailUnsub();\n    if (this._authUnsub) this._authUnsub();\n  }\n  syncSignaturePreview() {\n    const el = this.sigPreviewRef.current;\n    if (!el) return;\n    const student = this.state.students.find(x => x.id === this.state.selectedStudentId);\n    const url = student ? student.signatureUrl : null;\n    if (url && el.src !== url) el.src = url;\n  }\n\n  \/\/ --- Firebase Auth: qui\u00e9n est\u00e1 entrando (staff o estudiante) ---\n  initAuth() {\n    if (fbSdk.isSignInWithEmailLink(fbAuth, window.location.href)) {\n      const finishSignIn = (email) => {\n        fbSdk.signInWithEmailLink(fbAuth, email, window.location.href)\n          .then(() => {\n            window.localStorage.removeItem('cpAccessEmail');\n            window.history.replaceState({}, document.title, window.location.pathname);\n          })\n          .catch(() => {\n            this.setState({ authLoading: false, authError: 'El link de acceso no es v\u00e1lido o ya venci\u00f3. Pide que te reenv\u00eden el acceso.' });\n          });\n      };\n      const savedEmail = window.localStorage.getItem('cpAccessEmail');\n      if (savedEmail) finishSignIn(savedEmail);\n      else {\n        const typed = window.prompt('Confirma tu correo para ingresar:');\n        if (typed && typed.trim()) finishSignIn(typed.trim());\n        else this.setState({ authLoading: false });\n      }\n    }\n    this._authUnsub = fbSdk.onAuthStateChanged(fbAuth, (user) => this.handleAuthChange(user));\n  }\n\n  handleAuthChange = (user) => {\n    this.stopDataSubscriptions();\n    if (!user) {\n      this.setState({ authLoading: false, session: null, studentSession: null });\n      return;\n    }\n    fbSdk.getDoc(fbSdk.doc(fbDb, 'users', user.uid)).then((userSnap) => {\n      if (userSnap.exists()) {\n        const u = userSnap.data();\n        this.setState({\n          authLoading: false, authError: '',\n          session: { role: u.role, teacherId: u.teacherId || null, name: u.name || (u.role === 'admin' ? 'Admin' : 'Profesor') },\n          studentSession: null,\n        });\n        this.startStaffData();\n        return;\n      }\n      const studentsRef = fbSdk.collection(fbDb, 'students');\n      fbSdk.getDocs(fbSdk.query(studentsRef, fbSdk.where('authUid', '==', user.uid))).then((byUid) => {\n        if (!byUid.empty) {\n          const sid = byUid.docs[0].id;\n          this.setState({ authLoading: false, authError: '', session: null, studentSession: { studentId: sid } });\n          this.startStudentData(sid);\n          return;\n        }\n        \/\/ Primer ingreso v\u00eda el link emailado: vinculamos la cuenta a la ficha por su correo.\n        fbSdk.getDocs(fbSdk.query(studentsRef, fbSdk.where('email', '==', user.email))).then((byEmail) => {\n          if (byEmail.empty) {\n            this.setState({ authLoading: false, authError: 'No encontramos una ficha con este correo. Contacta al gimnasio.', session: null, studentSession: null });\n            fbSdk.signOut(fbAuth);\n            return;\n          }\n          const sid = byEmail.docs[0].id;\n          fbSdk.updateDoc(fbSdk.doc(fbDb, 'students', sid), { authUid: user.uid }).then(() => {\n            this.setState({ authLoading: false, authError: '', session: null, studentSession: { studentId: sid } });\n            this.startStudentData(sid);\n          });\n        });\n      });\n    });\n  };\n\n  stopDataSubscriptions() {\n    (this._unsub || []).forEach(fn => fn && fn());\n    this._unsub = [];\n  }\n  startStaffData() {\n    const unsub = [];\n    unsub.push(fbSdk.onSnapshot(fbSdk.collection(fbDb, 'teachers'), (snap) => {\n      const teachers = snap.docs.map(d => ({ id: d.id, ...d.data() }));\n      this.setState((st) => ({ teachers, agendaTeacherId: st.agendaTeacherId || (teachers[0] && teachers[0].id) || null }));\n    }));\n    unsub.push(fbSdk.onSnapshot(fbSdk.collection(fbDb, 'students'), (snap) => {\n      this.setState({ students: snap.docs.map(d => ({ id: d.id, ...d.data() })) });\n    }));\n    unsub.push(fbSdk.onSnapshot(fbSdk.collection(fbDb, 'attendance'), (snap) => {\n      this.setState({ attendance: snap.docs.map(d => ({ id: d.id, ...d.data() })) });\n    }));\n    unsub.push(fbSdk.onSnapshot(fbSdk.collection(fbDb, 'rsvps'), (snap) => {\n      this.setState({ rsvps: snap.docs.map(d => ({ id: d.id, ...d.data() })) });\n    }));\n    unsub.push(fbSdk.onSnapshot(fbSdk.query(fbSdk.collection(fbDb, 'activityLog'), fbSdk.orderBy('at', 'desc')), (snap) => {\n      this.setState({ activityLog: snap.docs.map(d => ({ id: d.id, ...d.data() })) });\n    }));\n    this._unsub = unsub;\n  }\n  startStudentData(studentId) {\n    const unsub = [];\n    unsub.push(fbSdk.onSnapshot(fbSdk.doc(fbDb, 'students', studentId), (snap) => {\n      this.setState({ myStudent: snap.exists() ? { id: snap.id, ...snap.data() } : null });\n    }));\n    unsub.push(fbSdk.onSnapshot(fbSdk.collection(fbDb, 'teachers'), (snap) => {\n      this.setState({ teachers: snap.docs.map(d => ({ id: d.id, ...d.data() })) });\n    }));\n    unsub.push(fbSdk.onSnapshot(fbSdk.query(fbSdk.collection(fbDb, 'attendance'), fbSdk.where('studentId', '==', studentId)), (snap) => {\n      this.setState({ myAttendance: snap.docs.map(d => ({ id: d.id, ...d.data() })) });\n    }));\n    unsub.push(fbSdk.onSnapshot(fbSdk.query(fbSdk.collection(fbDb, 'rsvps'), fbSdk.where('studentId', '==', studentId)), (snap) => {\n      this.setState({ myRsvps: snap.docs.map(d => ({ id: d.id, ...d.data() })) });\n    }));\n    this._unsub = unsub;\n  }\n\n  \/\/ --- Login de staff ---\n  onLoginEmailChange = (e) => this.setState({ loginEmail: e.target.value });\n  onLoginPasswordChange = (e) => this.setState({ loginPassword: e.target.value });\n  submitStaffLogin = () => {\n    const { loginEmail, loginPassword } = this.state;\n    if (!loginEmail.trim() || !loginPassword) return;\n    this.setState({ authError: '' });\n    fbSdk.signInWithEmailAndPassword(fbAuth, loginEmail.trim(), loginPassword)\n      .catch(() => this.setState({ authError: 'Correo o contrase\u00f1a incorrectos.' }));\n  };\n  logout = () => {\n    fbSdk.signOut(fbAuth);\n    this.setState({ view: 'dashboard', selectedStudentId: null, modal: null, loginEmail: '', loginPassword: '' });\n  };\n  noop = () => {};\n\n  state = {\n    authLoading: true,\n    authError: '',\n    loginEmail: '',\n    loginPassword: '',\n    session: null, \/\/ staff: { role: 'admin'|'profesor', teacherId, name }\n    studentSession: null, \/\/ estudiante: { studentId }\n    myStudent: null,\n    myAttendance: [],\n    myRsvps: [],\n    studentConsentChecked: false,\n\n    view: 'dashboard',\n    search: '',\n    studentsViewMode: 'list', \/\/ 'list' | 'grouped'\n    filterStatus: 'Todos',\n    filterPayment: 'Todos',\n    selectedStudentId: null,\n    studentTab: 'perfil',\n    students: [],\n    teachers: [],\n    sessions: generateSessions(),\n    attendance: [], \/\/ { sessionId, studentId, status, date }\n    rsvps: [], \/\/ { sessionId, studentId, intention, updatedAt }\n    agendaTeacherId: null,\n    agendaView: 'week', \/\/ 'day' | 'week' | 'month'\n    agendaDate: toISODate(new Date()),\n    moveTargetDate: '',\n    activityLog: [],\n    observacionesDraft: '', \/\/ nota de staff del estudiante seleccionado (vive en staffNotes\/{id})\n    modal: null, \/\/ { type, studentId, classId, teacherId }\n    attendanceDraft: {}, \/\/ studentId -> status\n    paymentMethodDraft: 'Transferencia',\n    editingProfile: false,\n    editingTraining: false,\n    profileDraft: {},\n    trainingDraft: {},\n    newStudentDraft: null,\n    newTeacherDraft: null,\n    editTeacherDraft: null,\n    editPaymentDraft: null,\n    reminderChannel: 'Ambos',\n    autoRemindersEnabled: true,\n    reminderDaysBefore: 3,\n    toast: '',\n    mobileNavOpen: false,\n    openDropdown: null, \/\/ key of the currently-open custom dropdown, or null\n  };\n\n  toggleMobileNav = () => this.setState({ mobileNavOpen: !this.state.mobileNavOpen });\n  closeMobileNav = () => this.setState({ mobileNavOpen: false });\n\n  \/\/ --- Custom dropdown lists (replaces native <select> so options are always\n  \/\/ rendered by us, never by an OS picker that can ignore our theme) ---\n  closeDropdown = () => this.setState({ openDropdown: null });\n  toggleDropdown = (key) => this.setState({ openDropdown: this.state.openDropdown === key ? null : key });\n  dropdownItems(items, activeValue, onPick) {\n    return items.map((it) => {\n      const value = (it && typeof it === 'object') ? it.value : it;\n      const label = (it && typeof it === 'object') ? it.label : it;\n      const active = value === activeValue;\n      return {\n        label,\n        color: active ? '#22d3ee' : '#f2f3f5',\n        bg: active ? 'rgba(34,211,238,0.10)' : 'transparent',\n        select: () => { onPick(value); this.closeDropdown(); },\n      };\n    });\n  }\n\n  go = (view) => this.setState({ view, modal: null, mobileNavOpen: false });\n  goTeachers = () => this.setState({ view: 'teachers' });\n\n  onSearchChange = (e) => {\n    const v = e.target.value;\n    this.setState({ search: v });\n    if (v.trim().length > 0 && this.state.view !== 'students') this.setState({ view: 'students' });\n  };\n\n  setStudentsViewMode = (mode) => this.setState({ studentsViewMode: mode });\n\n  openStudent = (id) => {\n    this.setState({ view: 'studentDetail', selectedStudentId: id, studentTab: 'perfil', observacionesDraft: '' });\n    if (this._detailUnsub) this._detailUnsub();\n    this._detailUnsub = fbSdk.onSnapshot(fbSdk.doc(fbDb, 'staffNotes', id), (snap) => {\n      this.setState({ observacionesDraft: snap.exists() ? (snap.data().text || '') : '' });\n    });\n  };\n  backToStudents = () => {\n    if (this._detailUnsub) { this._detailUnsub(); this._detailUnsub = null; }\n    this.setState({ view: 'students', selectedStudentId: null });\n  };\n  setStudentTab = (tab) => this.setState({ studentTab: tab });\n\n  onObservacionesChange = (e) => this.setState({ observacionesDraft: e.target.value });\n  saveObservacion = () => {\n    const id = this.state.selectedStudentId;\n    const text = this.state.observacionesDraft.trim();\n    if (!text) return;\n    fbSdk.setDoc(fbSdk.doc(fbDb, 'staffNotes', id), { text, updatedAt: fbSdk.serverTimestamp(), updatedBy: this.currentUserName() });\n    const student = this.state.students.find(s => s.id === id);\n    this.logEvent(id, 'Se agreg\u00f3 una observaci\u00f3n a ' + (student ? student.name : ''), '#9a9ca3');\n  };\n\n  currentUserName() {\n    if (this.state.session) return this.state.session.name || (this.state.session.role === 'admin' ? 'Admin' : 'Profesor');\n    return '';\n  }\n\n  \/\/ Cada evento se escribe directo en Firestore (con hora real del servidor);\n  \/\/ el feed de \"Actividad reciente\" llega de vuelta solo v\u00eda la suscripci\u00f3n.\n  logEvent(studentId, text, color) {\n    fbSdk.addDoc(fbSdk.collection(fbDb, 'activityLog'), { studentId, text, color, user: this.currentUserName(), at: fbSdk.serverTimestamp() });\n  }\n\n  \/\/ --- Perfil edit ---\n  startEditProfile = () => {\n    const st = this.state.students.find(x => x.id === this.state.selectedStudentId);\n    this.setState({ editingProfile: true, profileDraft: { name: st.name, birthdate: st.birthdate, gender: st.gender, phone: st.phone, email: st.email, instagram: st.instagram, city: st.city, comuna: st.comuna, teacherId: st.teacherId, status: st.status } });\n  };\n  cancelEditProfile = () => this.setState({ editingProfile: false });\n  updateProfileDraft = (field) => (e) => this.setState({ profileDraft: { ...this.state.profileDraft, [field]: e.target.value } });\n  saveProfile = () => {\n    const id = this.state.selectedStudentId;\n    const before = this.state.students.find(x => x.id === id);\n    const draft = this.state.profileDraft;\n    fbSdk.updateDoc(fbSdk.doc(fbDb, 'students', id), draft);\n    let logged = false;\n    if (draft.teacherId !== before.teacherId) { this.logEvent(id, 'Cambio de profesor: ' + this.teacherNameById(before.teacherId) + ' \u2192 ' + this.teacherNameById(draft.teacherId), '#22d3ee'); logged = true; }\n    if (draft.status !== before.status) { this.logEvent(id, 'Cambio de estado: ' + before.status + ' \u2192 ' + draft.status, '#fbbf24'); logged = true; }\n    if (draft.name !== before.name) { this.logEvent(id, 'Se actualiz\u00f3 el nombre a ' + draft.name, '#9a9ca3'); logged = true; }\n    if (!logged) this.logEvent(id, 'Se actualiz\u00f3 el perfil de ' + draft.name, '#9a9ca3');\n    this.setState({ editingProfile: false });\n  };\n  teacherNameById(id) { return (this.state.teachers.find(t => t.id === id) || {}).name || '\u2014'; }\n\n  \/\/ --- Entrenamiento edit ---\n  startEditTraining = () => {\n    const st = this.state.students.find(x => x.id === this.state.selectedStudentId);\n    this.setState({ editingTraining: true, trainingDraft: { goal: st.goal, level: st.level, modality: st.modality, freq: st.freq } });\n  };\n  cancelEditTraining = () => this.setState({ editingTraining: false });\n  updateTrainingDraft = (field) => (e) => this.setState({ trainingDraft: { ...this.state.trainingDraft, [field]: field === 'freq' ? Number(e.target.value) : e.target.value } });\n  saveTraining = () => {\n    const id = this.state.selectedStudentId;\n    fbSdk.updateDoc(fbSdk.doc(fbDb, 'students', id), this.state.trainingDraft);\n    this.logEvent(id, 'Se actualiz\u00f3 el plan de entrenamiento', '#9a9ca3');\n    this.setState({ editingTraining: false });\n  };\n\n  \/\/ --- Eliminar estudiante ---\n  openDeleteConfirm = () => this.setState({ modal: { type: 'confirmDelete', studentId: this.state.selectedStudentId } });\n  confirmDeleteStudent = () => {\n    const id = this.state.modal.studentId;\n    fbSdk.deleteDoc(fbSdk.doc(fbDb, 'students', id));\n    this.setState({ modal: null, view: 'students', selectedStudentId: null });\n  };\n\n  \/\/ --- Nuevo estudiante ---\n  openNewStudentModal = () => this.setState({ modal: { type: 'newStudent' }, newStudentDraft: { name: '', email: '', phone: '', teacherId: (this.state.teachers[0] || {}).id || '', level: 'Principiante', modality: 'Presencial', goal: '', freq: 2, status: 'Activo' } });\n  updateNewStudentDraft = (field) => (e) => this.setState({ newStudentDraft: { ...this.state.newStudentDraft, [field]: field === 'freq' ? Number(e.target.value) : e.target.value } });\n  saveNewStudent = () => {\n    const d = this.state.newStudentDraft;\n    if (!d.name.trim() || !d.email.trim()) { this.showToast('El nombre y el correo son obligatorios (el correo es donde le llega el acceso)'); return; }\n    const email = d.email.trim();\n    const newStudent = {\n      name: d.name.trim(), teacherId: d.teacherId, status: d.status, level: d.level, modality: d.modality, goal: d.goal, freq: d.freq,\n      joinDate: toISODate(new Date()), amount: 45000, dueDate: toISODate(new Date()), paymentStatus: 'Pendiente', method: '\u2014', paymentNotes: '',\n      documents: [], lastReminderSent: '', birthdate: '', gender: '', phone: d.phone || '', email, instagram: '', city: '', comuna: '',\n      authUid: null, consentSignedAt: null, consentVersion: null, signatureUrl: null,\n    };\n    fbSdk.addDoc(fbSdk.collection(fbDb, 'students'), newStudent).then((ref) => {\n      this.logEvent(ref.id, 'Estudiante creado: ' + newStudent.name, '#22d3ee');\n    });\n    this.sendAccessLink(email);\n    this.setState({ modal: null });\n  };\n\n  sendAccessLink = (email) => {\n    const actionCodeSettings = { url: window.location.origin + window.location.pathname, handleCodeInApp: true };\n    fbSdk.sendSignInLinkToEmail(fbAuth, email, actionCodeSettings)\n      .then(() => this.showToast('Se envi\u00f3 el acceso a ' + email))\n      .catch((err) => this.showToast('No se pudo enviar el correo de acceso: ' + err.message));\n  };\n  resendAccessLink = () => {\n    const st = this.state.students.find(x => x.id === this.state.selectedStudentId);\n    if (!st || !st.email) { this.showToast('Este estudiante no tiene correo registrado'); return; }\n    this.sendAccessLink(st.email);\n  };\n\n  \/\/ --- Profesores ---\n  openNewTeacherModal = () => this.setState({ modal: { type: 'newTeacher' }, newTeacherDraft: { name: '', email: '', phone: '', instagram: '', status: TEACHER_STATUS_OPTIONS[0] } });\n  updateNewTeacherDraft = (field) => (e) => this.setState({ newTeacherDraft: { ...this.state.newTeacherDraft, [field]: e.target.value } });\n  saveNewTeacher = () => {\n    const d = this.state.newTeacherDraft;\n    if (!d.name.trim()) return;\n    fbSdk.addDoc(fbSdk.collection(fbDb, 'teachers'), d);\n    this.setState({ modal: null });\n  };\n  openEditTeacherModal = (teacherId) => {\n    const t = this.state.teachers.find(x => x.id === teacherId);\n    this.setState({ modal: { type: 'editTeacher', teacherId }, editTeacherDraft: { name: t.name, email: t.email, phone: t.phone, instagram: t.instagram, status: t.status } });\n  };\n  updateEditTeacherDraft = (field) => (e) => this.setState({ editTeacherDraft: { ...this.state.editTeacherDraft, [field]: e.target.value } });\n  saveEditTeacher = () => {\n    const id = this.state.modal.teacherId;\n    fbSdk.updateDoc(fbSdk.doc(fbDb, 'teachers', id), this.state.editTeacherDraft);\n    this.setState({ modal: null });\n  };\n\n  \/\/ --- Editar datos de pago ---\n  openEditPaymentModal = (studentId) => {\n    const st = this.state.students.find(x => x.id === studentId);\n    this.setState({ modal: { type: 'editPayment', studentId }, editPaymentDraft: { amount: st.amount, dueDate: st.dueDate, paymentNotes: st.paymentNotes } });\n  };\n  updateEditPaymentDraft = (field) => (e) => this.setState({ editPaymentDraft: { ...this.state.editPaymentDraft, [field]: field === 'amount' ? Number(e.target.value) : e.target.value } });\n  saveEditPayment = () => {\n    const id = this.state.modal.studentId;\n    fbSdk.updateDoc(fbSdk.doc(fbDb, 'students', id), this.state.editPaymentDraft);\n    const student = this.state.students.find(x => x.id === id);\n    this.logEvent(id, 'Se actualizaron los datos de pago de ' + (student ? student.name : ''), '#9a9ca3');\n    this.setState({ modal: null });\n  };\n\n  \/\/ --- Historial: acciones r\u00e1pidas ---\n  logInjury = () => {\n    const id = this.state.selectedStudentId;\n    const student = this.state.students.find(x => x.id === id);\n    this.logEvent(id, 'Lesi\u00f3n registrada para ' + (student ? student.name : ''), '#f87171');\n  };\n  logMedicalClearance = () => {\n    const id = this.state.selectedStudentId;\n    const student = this.state.students.find(x => x.id === id);\n    this.logEvent(id, 'Alta m\u00e9dica registrada para ' + (student ? student.name : ''), '#34d399');\n  };\n\n  \/\/ --- Consentimientos: subir PDF ---\n  uploadConsent = (e) => {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const id = this.state.selectedStudentId;\n    const path = 'students\/' + id + '\/documents\/' + Date.now() + '_' + file.name;\n    const fileRef = fbSdk.ref(fbStorage, path);\n    fbSdk.uploadBytes(fileRef, file).then(() => fbSdk.getDownloadURL(fileRef)).then((url) => {\n      const student = this.state.students.find(x => x.id === id);\n      const docs = ((student && student.documents) || []).concat([{ name: file.name, date: toISODate(new Date()), url }]);\n      fbSdk.updateDoc(fbSdk.doc(fbDb, 'students', id), { documents: docs });\n      this.logEvent(id, 'Se subi\u00f3 el documento \"' + file.name + '\" de ' + (student ? student.name : ''), '#22d3ee');\n    }).catch((err) => this.showToast('Error al subir el documento: ' + err.message));\n    e.target.value = '';\n  };\n\n  showToast = (text) => {\n    this.setState({ toast: text });\n    clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(() => this.setState({ toast: '' }), 2800);\n  };\n\n  sendReminder = (studentId) => {\n    const student = this.state.students.find(x => x.id === studentId);\n    const channel = this.state.reminderChannel;\n    const overdue = student.paymentStatus === 'Atrasado';\n    const msg = overdue\n      ? 'Hola ' + student.name + ', notamos que tu mensualidad de Calistenia Progresiva sigue pendiente. \u00bfNos ayudas a regularizarla a la brevedad? Cualquier duda, escr\u00edbenos.'\n      : 'Hola ' + student.name + ', te recordamos que tu mensualidad de Calistenia Progresiva vence pronto (' + fmtDate(student.dueDate) + '). \u00a1Gracias!';\n    const wantsEmail = channel === 'Email' || channel === 'Ambos';\n    const wantsWhatsapp = channel === 'WhatsApp' || channel === 'Ambos';\n    let opened = false;\n    if (wantsEmail) {\n      if (student.email) {\n        window.open('mailto:' + student.email + '?subject=' + encodeURIComponent('Recordatorio de pago \u00b7 Calistenia Progresiva') + '&body=' + encodeURIComponent(msg), '_blank');\n        opened = true;\n      }\n    }\n    if (wantsWhatsapp) {\n      if (student.phone) {\n        const cleanPhone = student.phone.replace(\/[^0-9]\/g, '');\n        window.open('https:\/\/wa.me\/' + cleanPhone + '?text=' + encodeURIComponent(msg), '_blank');\n        opened = true;\n      }\n    }\n    const todayIso = toISODate(new Date());\n    fbSdk.updateDoc(fbSdk.doc(fbDb, 'students', studentId), { lastReminderSent: todayIso });\n    const channelLabel = channel === 'Ambos' ? 'email y WhatsApp' : channel.toLowerCase();\n    this.logEvent(studentId, 'Se envi\u00f3 un recordatorio de pago' + (overdue ? ' (atrasado)' : '') + ' a ' + student.name + ' por ' + channelLabel, '#22d3ee');\n    this.showToast(opened ? 'Recordatorio enviado a ' + student.name : 'Falta correo o tel\u00e9fono de ' + student.name + ' para enviar');\n  };\n\n  toggleAutoReminders = () => this.setState({ autoRemindersEnabled: !this.state.autoRemindersEnabled });\n  setReminderDaysBefore = (e) => this.setState({ reminderDaysBefore: Number(e.target.value) });\n\n  openPaymentModal = (studentId) => this.setState({ modal: { type: 'payment', studentId }, paymentMethodDraft: 'Transferencia' });\n  selectPaymentMethod = (m) => this.setState({ paymentMethodDraft: m });\n  confirmPayment = () => {\n    const { studentId } = this.state.modal;\n    fbSdk.updateDoc(fbSdk.doc(fbDb, 'students', studentId), { paymentStatus: 'Al d\u00eda', method: this.state.paymentMethodDraft });\n    const student = this.state.students.find(s => s.id === studentId);\n    this.logEvent(studentId, (student ? student.name : '') + ' pag\u00f3 su mensualidad (' + this.state.paymentMethodDraft + ')', '#34d399');\n    this.setState({ modal: null });\n  };\n\n  \/\/ --- Agenda: navegaci\u00f3n ---\n  setAgendaView = (mode) => this.setState({ agendaView: mode });\n  agendaToday = () => this.setState({ agendaDate: toISODate(new Date()) });\n  agendaPrev = () => {\n    const { agendaView, agendaDate } = this.state;\n    if (agendaView === 'day') this.setState({ agendaDate: addDays(agendaDate, -1) });\n    else if (agendaView === 'week') this.setState({ agendaDate: addDays(agendaDate, -7) });\n    else { const d = parseISO(agendaDate); d.setMonth(d.getMonth() - 1); this.setState({ agendaDate: toISODate(d) }); }\n  };\n  agendaNext = () => {\n    const { agendaView, agendaDate } = this.state;\n    if (agendaView === 'day') this.setState({ agendaDate: addDays(agendaDate, 1) });\n    else if (agendaView === 'week') this.setState({ agendaDate: addDays(agendaDate, 7) });\n    else { const d = parseISO(agendaDate); d.setMonth(d.getMonth() + 1); this.setState({ agendaDate: toISODate(d) }); }\n  };\n  agendaGoToDate = (iso) => this.setState({ agendaDate: iso, agendaView: 'day' });\n\n  \/\/ La grilla de clases (SESSION_TEMPLATES\/generateSessions) sigue siendo local\n  \/\/ por ahora \u2014 no hay todav\u00eda un editor de horarios; solo la asistencia,\n  \/\/ los RSVP y el resto de los datos viven en Firestore.\n  openAttendanceModal = (sessionId) => {\n    const session = this.state.sessions.find(x => x.id === sessionId);\n    const draft = {};\n    session.studentIds.forEach(id => {\n      const existing = this.state.attendance.find(a => a.sessionId === sessionId && a.studentId === id);\n      draft[id] = existing ? existing.status : 'Asisti\u00f3';\n    });\n    this.setState({ modal: { type: 'attendance', sessionId }, attendanceDraft: draft });\n  };\n  setAttendance = (studentId, status) => this.setState({ attendanceDraft: { ...this.state.attendanceDraft, [studentId]: status } });\n  closeModal = () => this.setState({ modal: null });\n  confirmAttendance = () => {\n    const sessionId = this.state.modal.sessionId;\n    const session = this.state.sessions.find(x => x.id === sessionId);\n    const draft = this.state.attendanceDraft;\n    Object.keys(draft).forEach((studentId) => {\n      const docId = sessionId + '_' + studentId;\n      fbSdk.setDoc(fbSdk.doc(fbDb, 'attendance', docId), { sessionId, studentId, status: draft[studentId], date: session.date });\n      const student = this.state.students.find(s => s.id === studentId);\n      this.logEvent(studentId, (student ? student.name : '') + ' \u2014 asistencia del ' + fmtDateLong(session.date) + ': ' + draft[studentId], draft[studentId] === 'Asisti\u00f3' ? '#34d399' : draft[studentId] === 'Atrasado' ? '#fbbf24' : '#f87171');\n    });\n    this.setState({ modal: null });\n  };\n\n  \/\/ --- Agenda: mover estudiante (local por ahora, ver nota arriba) ---\n  openMoveModal = (sessionId, studentId) => this.setState({ modal: { type: 'moveStudent', sessionId, studentId }, moveTargetDate: '' });\n  setMoveTargetDate = (e) => this.setState({ moveTargetDate: e.target.value });\n  confirmMove = () => {\n    const { sessionId, studentId } = this.state.modal;\n    const targetDate = this.state.moveTargetDate;\n    if (!targetDate) return;\n    const source = this.state.sessions.find(x => x.id === sessionId);\n    let sessions = this.state.sessions.slice();\n    let target = sessions.find(x => x.teacherId === source.teacherId && x.date === targetDate);\n    if (!target) {\n      target = { id: 'adhoc-' + studentId + '-' + targetDate, date: targetDate, hora: source.hora, lugar: source.lugar, teacherId: source.teacherId, studentIds: [] };\n      sessions.push(target);\n    }\n    sessions = sessions.map(x => {\n      if (x.id === source.id) return { ...x, studentIds: x.studentIds.filter(id => id !== studentId) };\n      if (x.id === target.id) return { ...x, studentIds: x.studentIds.includes(studentId) ? x.studentIds : [...x.studentIds, studentId] };\n      return x;\n    });\n    const wasAbsent = this.state.attendance.some(a => a.sessionId === source.id && a.studentId === studentId && a.status === 'Ausente');\n    const student = this.state.students.find(x => x.id === studentId);\n    if (wasAbsent) this.logEvent(studentId, (student ? student.name : '') + ' falt\u00f3 el ' + fmtDateLong(source.date) + ' y se reagend\u00f3 para el ' + fmtDateLong(targetDate), '#fbbf24');\n    else this.logEvent(studentId, 'Se movi\u00f3 a ' + (student ? student.name : '') + ' del ' + fmtDateLong(source.date) + ' al ' + fmtDateLong(targetDate), '#22d3ee');\n    this.setState({ sessions, modal: null });\n  };\n\n  \/\/ --- Firma \/ consentimiento: subida a Storage + marca de consentimiento ---\n  getCanvasPoint(e) {\n    const canvas = this.sigCanvasRef.current;\n    const rect = canvas.getBoundingClientRect();\n    const scaleX = canvas.width \/ rect.width;\n    const scaleY = canvas.height \/ rect.height;\n    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };\n  }\n  onSigPointerDown = (e) => { this._drawing = true; this._lastPoint = this.getCanvasPoint(e); };\n  onSigPointerMove = (e) => {\n    if (!this._drawing) return;\n    const canvas = this.sigCanvasRef.current;\n    if (!canvas) return;\n    const ctx = canvas.getContext('2d');\n    const p = this.getCanvasPoint(e);\n    ctx.lineWidth = 2.5;\n    ctx.lineCap = 'round';\n    ctx.strokeStyle = '#111114';\n    ctx.beginPath();\n    ctx.moveTo(this._lastPoint.x, this._lastPoint.y);\n    ctx.lineTo(p.x, p.y);\n    ctx.stroke();\n    this._lastPoint = p;\n  };\n  onSigPointerUp = () => { this._drawing = false; this._lastPoint = null; };\n  clearSignature = () => {\n    const canvas = this.sigCanvasRef.current;\n    if (!canvas) return;\n    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);\n  };\n  uploadSignatureAndMarkConsent(studentId, extraLogText) {\n    const canvas = this.sigCanvasRef.current;\n    const dataUrl = canvas.toDataURL('image\/png');\n    const fileRef = fbSdk.ref(fbStorage, 'signatures\/' + studentId + '.png');\n    return fbSdk.uploadString(fileRef, dataUrl, 'data_url').then(() => fbSdk.getDownloadURL(fileRef)).then((url) => {\n      fbSdk.updateDoc(fbSdk.doc(fbDb, 'students', studentId), {\n        signatureUrl: url,\n        consentSignedAt: fbSdk.serverTimestamp(),\n        consentVersion: CONSENT_VERSION,\n      });\n      if (extraLogText) this.logEvent(studentId, extraLogText, '#22d3ee');\n      return url;\n    });\n  }\n  \/\/ Firma asistida por staff (p. ej. el admin firma en el celular junto al estudiante).\n  openSignatureModal = () => this.setState({ modal: { type: 'signature', studentId: this.state.selectedStudentId } });\n  confirmSignature = () => {\n    const id = this.state.modal.studentId;\n    const student = this.state.students.find(s => s.id === id);\n    this.uploadSignatureAndMarkConsent(id, 'Consentimiento firmado por ' + (student ? student.name : '') + ' (asistido por staff)')\n      .then(() => this.setState({ modal: null }))\n      .catch((err) => this.showToast('Error al guardar la firma: ' + err.message));\n  };\n\n  \/\/ --- Portal de estudiante ---\n  toggleStudentConsentChecked = () => this.setState({ studentConsentChecked: !this.state.studentConsentChecked });\n  confirmStudentConsent = () => {\n    if (!this.state.studentConsentChecked) { this.showToast('Primero debes aceptar los t\u00e9rminos'); return; }\n    const id = this.state.studentSession.studentId;\n    this.uploadSignatureAndMarkConsent(id)\n      .catch((err) => this.showToast('Error al guardar la firma: ' + err.message));\n  };\n  todaySessionsForMe() {\n    const studentId = this.state.studentSession ? this.state.studentSession.studentId : null;\n    if (!studentId) return [];\n    const todayISO = toISODate(new Date());\n    return this.state.sessions.filter(x => x.date === todayISO && x.studentIds.includes(studentId));\n  }\n  setMyRsvp = (sessionId, intention) => {\n    const studentId = this.state.studentSession.studentId;\n    const docId = sessionId + '_' + studentId;\n    fbSdk.setDoc(fbSdk.doc(fbDb, 'rsvps', docId), { sessionId, studentId, intention, updatedAt: fbSdk.serverTimestamp() });\n  };\n  computeMyStreak() {\n    const studentId = this.state.studentSession ? this.state.studentSession.studentId : null;\n    if (!studentId) return 0;\n    const todayISO = toISODate(new Date());\n    const mine = this.state.sessions\n      .filter(x => x.date <= todayISO && x.studentIds.includes(studentId))\n      .sort((a, b) => b.date.localeCompare(a.date));\n    let streak = 0;\n    for (const sess of mine) {\n      const rec = this.state.myAttendance.find(a => a.sessionId === sess.id);\n      if (rec && (rec.status === 'Asisti\u00f3' || rec.status === 'Atrasado')) streak++;\n      else break;\n    }\n    return streak;\n  }\n  computeMyAttendanceRate() {\n    const marked = this.state.myAttendance;\n    if (marked.length === 0) return null;\n    const attended = marked.filter(a => a.status === 'Asisti\u00f3' || a.status === 'Atrasado').length;\n    return Math.round((attended \/ marked.length) * 100);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const session = s.session;\n    const role = session ? session.role : null;\n    const isAdmin = role === 'admin';\n    const currentTeacherId = session ? session.teacherId : null;\n\n    const visibleStudents = isAdmin ? s.students : s.students.filter(st => st.teacherId === currentTeacherId);\n    const q = s.search.trim().toLowerCase();\n    const teacherName = (tid) => (s.teachers.find(t => t.id === tid) || {}).name || '\u2014';\n\n    const filteredStudents = visibleStudents.filter(st => {\n      if (q && ![st.name, st.level, st.status, teacherName(st.teacherId), st.phone, st.email, st.instagram].join(' ').toLowerCase().includes(q)) return false;\n      if (s.filterStatus !== 'Todos' && st.status !== s.filterStatus) return false;\n      if (s.filterPayment !== 'Todos' && st.paymentStatus !== s.filterPayment) return false;\n      return true;\n    }).sort((a, b) => a.name.localeCompare(b.name, 'es')).map(st => ({\n      ...st,\n      initial: initials(st.name),\n      teacherName: teacherName(st.teacherId),\n      statusBg: STATUS_COLORS[st.status].bg,\n      statusColor: STATUS_COLORS[st.status].color,\n      paymentBg: PAY_COLORS[st.paymentStatus].bg,\n      paymentColor: PAY_COLORS[st.paymentStatus].color,\n      open: () => this.openStudent(st.id),\n    }));\n\n    const activeCount = visibleStudents.filter(st => st.status === 'Activo').length;\n    const pendingPayments = visibleStudents.filter(st => st.paymentStatus === 'Pendiente' || st.paymentStatus === 'Atrasado').length;\n    const visibleSessions = isAdmin ? s.sessions : s.sessions.filter(c => c.teacherId === currentTeacherId);\n    const todayISO = toISODate(new Date());\n    const classesToday = visibleSessions.filter(c => c.date === todayISO).length;\n    const newThisMonth = visibleStudents.filter(st => st.joinDate.startsWith(todayISO.slice(0, 7))).length;\n    const monthIncome = visibleStudents.filter(st => st.paymentStatus === 'Al d\u00eda').reduce((sum, st) => sum + st.a
